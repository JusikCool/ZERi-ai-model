data:
  tickers: ["AAPL", "MSFT", "^IXIC", "^VIX"]
  start_date: "2015-01-01"
  end_date: "2025-01-01"
  window_size: 60
  horizon: 30
  vol_window: 20        # 실현변동성(σ) Rolling Window

model:
  quantiles: [0.05,0.10,0.15,0.20,0.25,0.30,
             0.35,0.40,0.45,0.50,0.55,
             0.60,0.65,0.70,0.75,0.80,
             0.85,0.90,0.95]
  vix_threshold: 25     # λt 선형 증가 시작 임계값 (raw VIX 기준, 주요 시장 위기 구간 하한선)
  hidden_size: 64
  attention_head_size: 4
  dropout: 0.1
  learning_rate: 0.0003
  max_epochs: 50
  batch_size: 64

ablation:
  m1_fixed_pinball: true    # M1 고정 Loss
  m2_vix_only: true         # M2 VIX만 반영
  m3_full_model: true       # M3 VIX + σ 완전 Adaptive

validation:
  violation_rate_threshold: 0.05
  kupiec_pvalue_threshold: 0.05
